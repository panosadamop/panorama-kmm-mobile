[versions]
# Toolchain
kotlin = "2.1.0"
agp = "8.11.2"
composeMultiplatform = "1.7.3"

# Android SDK levels
# Google Play requires new apps/updates to target API 36 from 31 Aug 2026.
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"

# Libraries
androidx-activityCompose = "1.9.3"
# Pinned only to lift play-services-basement's transitive fragment 1.1.0, which breaks
# registerForActivityResult (lint InvalidFragmentVersionForActivityResult blocks release).
androidx-fragment = "1.8.5"
coroutines = "1.9.0"
# Kept in line with what RootEncoder (Android live streaming) pulls in transitively.
ktor = "3.1.1"
serialization = "1.7.3"
coil = "3.0.4"
voyager = "1.1.0-beta03"
multiplatformSettings = "1.2.0"
firebaseBom = "33.7.0"
googleServices = "4.4.2"
# 2.5.9 is the newest RootEncoder built with Kotlin 2.1 + Ktor 3 — later releases need
# Kotlin 2.2+ metadata (2.7+) or pull in Ktor 2 (2.6.x), which clashes with ours.
rootEncoder = "2.5.9"

[libraries]
# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Ktor (HTTP client)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Coil (image loading)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Voyager (navigation + screen models)
voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-screenmodel = { module = "cafe.adriel.voyager:voyager-screenmodel", version.ref = "voyager" }
voyager-transitions = { module = "cafe.adriel.voyager:voyager-transitions", version.ref = "voyager" }
voyager-tab-navigator = { module = "cafe.adriel.voyager:voyager-tab-navigator", version.ref = "voyager" }

# Multiplatform Settings (bookmark persistence)
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }
multiplatform-settings-serialization = { module = "com.russhwolf:multiplatform-settings-serialization", version.ref = "multiplatformSettings" }

# Android
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }

# Firebase (push notifications — see RUNNING.md → "Push notifications" for setup)
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

# RootEncoder (Android live streaming over RTMP/RTMPS to YouTube)
rootencoder-library = { module = "com.github.pedroSG94.RootEncoder:library", version.ref = "rootEncoder" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
